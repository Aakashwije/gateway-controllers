name: Gateway Controller Policy Integration Test

# Runs the integration tests of the policies a pull request changes, against gateway 1.2.0,
# 1.1.0 and the latest gateway image. The suite lives in this repository (tests/it); each policy
# keeps its runner declaration and features in policies/<name>/it/, and a change to any file in a
# policy's folder runs that policy's tests when it has an it/it.yaml. The test framework is a Go
# module published by wso2/api-platform and pinned in tests/it/go.mod, and the gateway and
# testbench images come from GHCR, so nothing in this workflow needs an api-platform checkout
# once the framework is released.

on:
  workflow_dispatch:
    inputs:
      policies:
        description: "Comma-separated policies to test, or 'all' for every policy with integration tests"
        required: true
        default: all
  pull_request:
    branches:
      - main
    paths:
      - 'policies/**'
      - 'tests/it/**'
      - 'scripts/it/**'
      - 'Makefile'
      - '.github/workflows/it.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

# TEMP: the framework is not released yet, so the jobs below check it out from a fork branch and
# tests/it/go.mod resolves it through a replace directive. Remove this block, the TEMP steps and
# the replace directive once tests/framework/v0.1.0 is tagged.
env:
  API_PLATFORM_REPOSITORY: Isuranga-2001/api-platform # TEMP
  API_PLATFORM_REF: feat/framework-module # TEMP

jobs:
  detect:
    name: Select policies
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      policies: ${{ steps.select.outputs.policies }}
      has_tests: ${{ steps.select.outputs.has_tests }}
      feature_roots: ${{ steps.select.outputs.feature_roots }}
    steps:
      - name: Checkout gateway-controllers
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select the policies to test
        id: select
        env:
          REQUESTED_POLICIES: ${{ inputs.policies }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          python3 scripts/it/test_changed_policies.py
          python3 scripts/it/test_scaffold.py
          if [[ -n "$REQUESTED_POLICIES" ]]; then
            python3 scripts/it/changed-policies.py --policies "$REQUESTED_POLICIES"
          else
            python3 scripts/it/changed-policies.py --base "$BASE_SHA"
          fi

  standards:
    name: Step and feature standards
    needs: detect
    if: needs.detect.outputs.has_tests == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout gateway-controllers
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: gateway-controllers
          persist-credentials: false

      - name: Checkout api-platform # TEMP
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ${{ env.API_PLATFORM_REPOSITORY }}
          ref: ${{ env.API_PLATFORM_REF }}
          path: api-platform
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26.5'
          cache-dependency-path: gateway-controllers/tests/it/go.sum

      - name: Check the steps and the changed policy features against the framework standards
        working-directory: gateway-controllers/tests/it
        env:
          FEATURE_ROOTS: ${{ needs.detect.outputs.feature_roots }}
        run: |
          set -euo pipefail
          roots=""
          IFS=',' read -ra relative <<< "$FEATURE_ROOTS"
          for root in "${relative[@]}"; do
            roots+="../../${root},"
          done
          go tool standards -root . -unit-root . -steps steps -features "${roots%,}" \
            -scripts "" -suites it-suite.yaml -docs "" \
            -approved-imports github.com/wso2/gateway-controllers/tests/it/

  integration-test:
    name: Gateway Integration (${{ matrix.gateway_version }})
    needs: detect
    if: needs.detect.outputs.has_tests == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - gateway_version: "1.2.0"
          # The patched 1.1.0 controller, runtime and gateway-builder images are published under
          # this repository prefix, not the ghcr.io release one. The stock 1.1.0 builder cannot
          # tidy policies that need a newer Go; the patched one downloads the toolchain.
          - gateway_version: "1.1.0"
            gateway_host: docker.io/isurangaws
          # The images api-platform publishes after each merge to main.
          - gateway_version: "latest"
            # TEMP: the fork publishes the latest images until api-platform does. Remove this
            # line at cut-over so the default ghcr.io/wso2/api-platform is used.
            gateway_host: ghcr.io/isuranga-2001/api-platform

    steps:
      - name: Checkout gateway-controllers
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: gateway-controllers
          persist-credentials: false

      - name: Checkout api-platform # TEMP
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ${{ env.API_PLATFORM_REPOSITORY }}
          ref: ${{ env.API_PLATFORM_REF }}
          path: api-platform
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26.5'
          cache-dependency-path: gateway-controllers/tests/it/go.sum

      # TEMP: a framework that is not released carries no embedded gateway files, because the
      # release generates them. Generate them in the checkout the replace directive points at.
      - name: Generate the framework's embedded snapshots # TEMP
        working-directory: api-platform/tests/framework
        run: go run ./cmd/syncassets

      # The suite's database matrix boots several short-lived containers and
      # published ports. Under concurrent connection churn, the default
      # conntrack table can fill and cause intermittent connection failures.
      - name: Raise the conntrack table limit
        run: sudo sysctl -w net.netfilter.nf_conntrack_max=524288

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      # TEMP: an unreleased framework has no published testbench image, so build the one that
      # matches the checkout. A released framework pulls ghcr.io/wso2/api-platform/testbench:<version>.
      - name: Build the testbench image # TEMP
        run: make -C api-platform/tests/framework testbench

      - name: Run the integration tests of the selected policies
        working-directory: gateway-controllers
        shell: bash
        env:
          GATEWAY_VERSION: ${{ matrix.gateway_version }}
          GATEWAY_HOST: ${{ matrix.gateway_host }}
          POLICIES: ${{ needs.detect.outputs.policies }}
        run: |
          set -euo pipefail
          make it POLICIES="$POLICIES" GATEWAY_VERSION="$GATEWAY_VERSION" GATEWAY_HOST="$GATEWAY_HOST" \
            2>&1 | tee "$GITHUB_WORKSPACE/policy-it-$GATEWAY_VERSION.log"

      - name: Upload the test output
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: gateway-controller-policy-test-output-${{ matrix.gateway_version }}
          path: policy-it-${{ matrix.gateway_version }}.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Dump Docker diagnostics on failure
        if: failure()
        shell: bash
        env:
          GATEWAY_VERSION: ${{ matrix.gateway_version }}
        run: |
          set +e
          diagnostics_dir="$GITHUB_WORKSPACE/docker-diagnostics-$GATEWAY_VERSION"
          mkdir -p "$diagnostics_dir"

          echo "=== Docker Containers ==="
          docker ps -a | tee "$diagnostics_dir/containers.txt"

          echo "=== Docker Logs ==="
          docker ps -aq | while read -r container_id; do
            container_name="$(docker inspect --format '{{.Name}}' "$container_id" | sed 's#^/##; s#[^A-Za-z0-9_.-]#_#g')"
            {
              echo "=== $container_name ($container_id) ==="
              docker logs "$container_id" 2>&1
              echo
            } >> "$diagnostics_dir/containers.log"
          done

      - name: Upload Docker diagnostics
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: gateway-controller-policy-docker-diagnostics-${{ matrix.gateway_version }}
          path: docker-diagnostics-${{ matrix.gateway_version }}
          if-no-files-found: ignore
          retention-days: 7
