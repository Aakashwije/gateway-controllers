name: Gateway Controller Policy Integration Test

# Runs the integration tests of the policies a pull request changes. The test suite
# (framework, steps, templates, testbench) lives in wso2/api-platform; each policy keeps its
# own features and runner declaration in policies/<name>/it/.

on:
  workflow_dispatch:
    inputs:
      policies:
        description: "Comma-separated policies to test, or 'all' for every policy with integration tests"
        required: true
        default: all
      api_platform_ref:
        description: "api-platform branch, tag or SHA that provides the test framework"
        required: false
        default: ""
  pull_request:
    branches:
      - main
    paths:
      - 'policies/**'
      - 'scripts/it/**'
      - '.github/workflows/it.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  # TEMP: test fork. Restore wso2/api-platform and main before this goes upstream.
  API_PLATFORM_REPOSITORY: Isuranga-2001/api-platform # TEMP
  API_PLATFORM_REF: ${{ inputs.api_platform_ref || 'feat/policy-it-v2.1' }} # TEMP

jobs:
  detect:
    name: Select policies
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      policies: ${{ steps.select.outputs.policies }}
      has_tests: ${{ steps.select.outputs.has_tests }}
      feature_roots: ${{ steps.select.outputs.feature_roots }}
    steps:
      - name: Checkout gateway-controllers
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select the policies to test
        id: select
        env:
          REQUESTED_POLICIES: ${{ inputs.policies }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          python3 scripts/it/test_changed_policies.py
          if [[ -n "$REQUESTED_POLICIES" ]]; then
            python3 scripts/it/changed-policies.py --policies "$REQUESTED_POLICIES"
          else
            python3 scripts/it/changed-policies.py --base "$BASE_SHA"
          fi

  standards:
    name: Feature standards
    needs: detect
    if: needs.detect.outputs.has_tests == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout gateway-controllers
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: gateway-controllers
          persist-credentials: false

      - name: Checkout api-platform
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ${{ env.API_PLATFORM_REPOSITORY }}
          ref: ${{ env.API_PLATFORM_REF }}
          path: api-platform
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26.5'
          cache-dependency-path: api-platform/tests/framework/go.sum

      - name: Check the policy features against the framework standards
        working-directory: api-platform/tests/framework
        env:
          FEATURE_ROOTS: ${{ needs.detect.outputs.feature_roots }}
        run: |
          set -euo pipefail
          roots=""
          IFS=',' read -ra relative <<< "$FEATURE_ROOTS"
          for root in "${relative[@]}"; do
            roots+="${GITHUB_WORKSPACE}/gateway-controllers/${root},"
          done
          go run ./cmd/standards -root "" -unit-root "" -steps "" -scripts "" -suites "" -docs "" \
            -features "${roots%,}"

  gateway-controller-tests:
    name: Gateway Controller unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CGO_ENABLED: "1"

    steps:
      - name: Checkout api-platform
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ${{ env.API_PLATFORM_REPOSITORY }}
          ref: ${{ env.API_PLATFORM_REF }}
          path: api-platform
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26.5'
          cache-dependency-path: |
            api-platform/go.work.sum
            api-platform/gateway/gateway-controller/go.sum

      - name: Ensure C compiler is available
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: Gateway-controller unit tests
        working-directory: api-platform
        run: make -C gateway/gateway-controller test

  integration-test:
    name: Gateway Integration (${{ matrix.gateway_version }})
    needs: detect
    if: needs.detect.outputs.has_tests == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        gateway_version: [latest, "1.2.0", "1.1.0"]

    steps:
      - name: Checkout gateway-controllers
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: gateway-controllers
          persist-credentials: false

      - name: Checkout api-platform
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ${{ env.API_PLATFORM_REPOSITORY }}
          ref: ${{ env.API_PLATFORM_REF }}
          path: api-platform
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26.5'
          cache-dependency-path: |
            api-platform/go.work.sum
            api-platform/tests/framework/go.sum

      # The suite's database matrix boots several short-lived containers and
      # published ports. Under concurrent connection churn, the default
      # conntrack table can fill and cause intermittent connection failures.
      - name: Raise the conntrack table limit
        run: sudo sysctl -w net.netfilter.nf_conntrack_max=524288

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Build framework testbench image
        run: make -C api-platform/tests/framework testbench

      - name: Run the integration tests of the selected policies
        working-directory: api-platform/tests/framework
        shell: bash
        env:
          GATEWAY_VERSION: ${{ matrix.gateway_version }}
          POLICIES: ${{ needs.detect.outputs.policies }}
        run: |
          set -euo pipefail

          suite_args=(-blocks=gateway-controller-policies "-policies=$POLICIES")
          if [[ "$GATEWAY_VERSION" != "latest" ]]; then
            suite_args+=("-gateway-version=$GATEWAY_VERSION")
          fi

          go test ./suites/it -count=1 -timeout=40m -v \
            -args "${suite_args[@]}" 2>&1 | tee "$GITHUB_WORKSPACE/framework-it-$GATEWAY_VERSION.log"

      - name: Upload framework test output
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: gateway-controller-policy-test-output-${{ matrix.gateway_version }}
          path: framework-it-${{ matrix.gateway_version }}.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Dump Docker diagnostics on failure
        if: failure()
        shell: bash
        env:
          GATEWAY_VERSION: ${{ matrix.gateway_version }}
        run: |
          set +e
          diagnostics_dir="$GITHUB_WORKSPACE/docker-diagnostics-$GATEWAY_VERSION"
          mkdir -p "$diagnostics_dir"

          echo "=== Docker Containers ==="
          docker ps -a | tee "$diagnostics_dir/containers.txt"

          echo "=== Docker Logs ==="
          docker ps -aq | while read -r container_id; do
            container_name="$(docker inspect --format '{{.Name}}' "$container_id" | sed 's#^/##; s#[^A-Za-z0-9_.-]#_#g')"
            {
              echo "=== $container_name ($container_id) ==="
              docker logs "$container_id" 2>&1
              echo
            } >> "$diagnostics_dir/containers.log"
          done

      - name: Upload Docker diagnostics
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: gateway-controller-policy-docker-diagnostics-${{ matrix.gateway_version }}
          path: docker-diagnostics-${{ matrix.gateway_version }}
          if-no-files-found: ignore
          retention-days: 7
