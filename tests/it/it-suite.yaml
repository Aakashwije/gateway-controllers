# The policy integration suite. Each policy declares its runners and feature files in
# policies/<name>/it/it.yaml; -policies=<name>[,<name>] limits a run to those policies and
# omitting it runs every policy that has tests. The gateway image is built with the whole
# policy tree, so a policy under test runs beside the rest of the catalog.

suite: policy-it-suite

defaults:
  parallel: 1
  components:
    platform-gateway:
      db: sqlite
      dbCompatibility:
        sqlserver: "gateway-version>=1.2.0"
  timeouts:
    boot: 5m
    propagation: 60s

blocks:
  - name: gateway-controller-policies
    parallel: 1
    runnersFrom: policies
    components:
      - name: platform-gateway
        db:
          matrix: [sqlite, postgres, sqlserver]
        addPoliciesFrom: policies
      - name: testbench
